name: Deploy Storybook
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.storybook/**'
      - '.github/workflows/deploy-storybook.yml'
      - '.github/workflows/validate.yml'
      - '.github/actions/setup-node/action.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  report:
    name: Report
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Report Validation
        uses: ./.github/actions/report-workflow
        with:
          title: Storybook Validation
          status: ${{ needs.validate.result }}
          commit: ${{ github.sha }}

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Ecosystem
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          
      - name: Deploy to S3
        run: aws s3 sync storybook-static/ s3://dat-freight-demo-storybook --delete
        
      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.STORYBOOK_DISTRIBUTION_ID }} --paths "/*"

      - name: Resolve Storybook URLs
        id: storybook-url
        run: |
          S3_BUCKET="dat-freight-demo-storybook"
          S3_REGION="$(aws s3api get-bucket-location --bucket "$S3_BUCKET" --query 'LocationConstraint' --output text)"
          if [[ "$S3_REGION" == "None" ]]; then S3_REGION="us-east-1"; fi
          CLOUDFRONT_URL="https://$(aws cloudfront get-distribution --id '${{ secrets.STORYBOOK_DISTRIBUTION_ID }}' --query 'Distribution.DomainName' --output text)"
          S3_WEBSITE_URL="http://${S3_BUCKET}.s3-website-${S3_REGION}.amazonaws.com/"
          echo "CloudFront URL: $CLOUDFRONT_URL"
          echo "S3 website URL: $S3_WEBSITE_URL"
          echo "cloudfront_url=$CLOUDFRONT_URL" >> "$GITHUB_OUTPUT"
          echo "s3_website_url=$S3_WEBSITE_URL" >> "$GITHUB_OUTPUT"

      - name: Report Storybook Deployment
        uses: ./.github/actions/report-workflow
        with:
          title: Storybook Deployment
          status: success
          commit: ${{ github.sha }}
          deployment-links: |
            | CloudFront | [${{ steps.storybook-url.outputs.cloudfront_url }}](${{ steps.storybook-url.outputs.cloudfront_url }}) |
            | S3 website | [${{ steps.storybook-url.outputs.s3_website_url }}](${{ steps.storybook-url.outputs.s3_website_url }}) |
          comment-on-pr: 'true'
