name: Validate Pull Request

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build-app:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Ecosystem
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          # Build-time only. Use a dedicated test API if E2E tests are added to validate.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Ecosystem
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

  report:
    name: Report
    needs: [ validate, build-app, build-storybook ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Report Validation
        uses: ./.github/actions/report-workflow
        with:
          title: Pull Request Validation
          status: ${{ needs.validate.result == 'success' && needs.build-app.result == 'success' && needs.build-storybook.result == 'success' && 'success' || 'failure' }}
          commit: ${{ github.event.pull_request.head.sha }}
          checks: |
            | Validation | `${{ needs.validate.result }}` |
            | Application build | `${{ needs.build-app.result }}` |
            | Storybook build | `${{ needs.build-storybook.result }}` |
          comment-on-pr: 'true'
