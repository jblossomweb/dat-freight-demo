name: Deploy Production SPA
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.storybook/**'
      - '**/*.stories.**'
      - '.github/actions/report-workflow/action.yml'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  report:
    name: Report
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Report Validation
        uses: ./.github/actions/report-workflow
        with:
          title: Application Validation
          status: ${{ needs.validate.result }}
          commit: ${{ github.sha }}

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js Ecosystem
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: npm ci
      
      - name: Build Application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
          
      - name: Deploy to S3
        run: aws s3 sync dist/ s3://dat-freight-demo --delete
        
      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.APP_DISTRIBUTION_ID }} --paths "/*"

      - name: Resolve Production URLs
        id: production-url
        run: |
          S3_BUCKET="dat-freight-demo"
          S3_REGION="$(aws s3api get-bucket-location --bucket "$S3_BUCKET" --query 'LocationConstraint' --output text)"
          if [[ "$S3_REGION" == "None" ]]; then S3_REGION="us-east-1"; fi
          CLOUDFRONT_URL="https://$(aws cloudfront get-distribution --id '${{ secrets.APP_DISTRIBUTION_ID }}' --query 'Distribution.DomainName' --output text)"
          S3_WEBSITE_URL="http://${S3_BUCKET}.s3-website-${S3_REGION}.amazonaws.com/"
          echo "CloudFront URL: $CLOUDFRONT_URL"
          echo "S3 website URL: $S3_WEBSITE_URL"
          echo "cloudfront_url=$CLOUDFRONT_URL" >> "$GITHUB_OUTPUT"
          echo "s3_website_url=$S3_WEBSITE_URL" >> "$GITHUB_OUTPUT"

      - name: Report Production Deployment
        uses: ./.github/actions/report-workflow
        with:
          title: Production Deployment
          status: success
          commit: ${{ github.sha }}
          deployment-links: |
            | CloudFront | [${{ steps.production-url.outputs.cloudfront_url }}](${{ steps.production-url.outputs.cloudfront_url }}) |
            | S3 website | [${{ steps.production-url.outputs.s3_website_url }}](${{ steps.production-url.outputs.s3_website_url }}) |
          comment-on-pr: 'true'
